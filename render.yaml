services:
  - type: web
    name: melhor-preco
    runtime: static
    # Render detects bun.lock and installs Bun itself; npm -g install fails there.
    buildCommand: bun install --frozen-lockfile && bun run build
    staticPublishPath: ./out
    pullRequestPreviewsEnabled: false
    headers:
      - path: /_next/static/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
